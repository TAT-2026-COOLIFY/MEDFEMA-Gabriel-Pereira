server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: o endereço do backend é resolvido a cada requisição,
    # assim o nginx não quebra se o backend ainda não estiver no ar
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Faz em produção o mesmo que o proxy.conf.json faz no "ng serve":
    # /api/medicos -> BACKEND_URL/medicos
    # BACKEND_URL deve vir SEM barra no final (ex.: http://medfema-backend:8080)
    location /api/ {
        set $backend ${BACKEND_URL};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }

    # Rotas do Angular: caminhos que não são arquivos voltam para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
