name: CI/CD - Deploy no Coolify

# Roda a cada push na main e também pode ser disparado à mão pela aba Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  COOLIFY_URL: https://computacao.fema.edu.br

jobs:
  # CI: garante que backend e frontend compilam antes de mandar para o servidor
  build:
    name: Build (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar backend (Spring Boot)
        # Testes pulados: o ApiApplicationTests precisa de um MySQL rodando
        run: mvn -B -DskipTests package

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar frontend (Angular)
        working-directory: frontend
        run: |
          npm ci
          npx ng build

  # CD: só roda se o build passou; pede ao Coolify para baixar a main e fazer o deploy
  deploy:
    name: Deploy no Coolify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy pela API do Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUIDS: ${{ vars.COOLIFY_APP_UUIDS }}
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUIDS&force=false"
